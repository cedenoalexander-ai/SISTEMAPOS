  <head>
    <meta charset="UTF-8" />

    <meta property="og:title" content="iMtec POS Pro - Sistema de Ventas y Cobranzas" />
    <meta property="og:description" content="Sistema de punto de venta (POS), facturación multimoneda (USD y Bs BCV), cuentas por cobrar, cuentas por pagar a proveedores y control de inventario sincronizado." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.json" />

    <style>
      * { -webkit-tap-highlight-color: transparent; }
      @media print {
        body * { visibility: hidden !important; }
        #ticketTermicoContainer, #ticketTermicoContainer *,
        #ticketCajaContainer, #ticketCajaContainer *,
        #reporteCajaCompleto, #reporteCajaCompleto *,
        #habladorPrecioContainer, #habladorPrecioContainer * { visibility: visible !important; }
        #ticketTermicoContainer, #ticketCajaContainer {
          position: absolute; left: 0; top: 0;
          font-family: 'Courier New', Courier, monospace;
          color: #000; background: white; margin: 0;
        }
        #ticketTermicoContainer.tamano-58mm, #ticketCajaContainer.tamano-58mm {
          width: 48mm !important;
          max-width: 48mm !important;
          font-size: 8.5px !important;
          padding: 1mm !important;
        }
        #ticketTermicoContainer.tamano-80mm, #ticketCajaContainer.tamano-80mm {
          width: 72mm !important;
          max-width: 72mm !important;
          font-size: 10.5px !important;
          padding: 2mm !important;
        }
        #reporteCajaCompleto {
          position: absolute; left: 0; top: 0; width: 100%;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
          color: #000; background: white; padding: 15px; margin: 0;
        }
        #habladorPrecioContainer {
          position: absolute; left: 0; top: 0; width: 100%;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
          color: #000; background: white; padding: 0; margin: 0;
        }
        @page { size: auto; margin: 0; }
      }
